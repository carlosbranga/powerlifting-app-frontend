<div class="min-h-screen bg-neutral-900 text-white font-sans flex flex-col">

  <header class="bg-neutral-800 border-b border-neutral-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <button routerLink="/dashboard" class="text-neutral-400 hover:text-orange-500 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      <h1 class="text-xl font-black text-orange-500 italic uppercase tracking-tighter">Treino do Dia</h1>
    </div>
    <span class="px-3 py-1 bg-orange-500/20 text-orange-500 rounded-lg text-xs font-bold uppercase">Semana 3</span>
  </header>

  <main class="flex-1 p-4 space-y-4 overflow-y-auto pb-24">
    
    <div *ngFor="let exercicio of exercicios" 
         class="bg-neutral-800 p-5 rounded-xl border transition-all duration-300 shadow-lg"
         [ngClass]="exercicio.concluido ? 'border-green-500/50 bg-neutral-800/80' : 'border-neutral-700'">
      
      <div class="flex justify-between items-start mb-4 border-b border-neutral-700 pb-3">
        <div>
          <h2 class="text-lg font-bold" [ngClass]="{'text-neutral-400 line-through': exercicio.concluido}">
            {{ exercicio.nome }}
          </h2>
          <p class="text-sm text-neutral-400 mt-1">Séries: <span class="font-bold text-white">{{ exercicio.series }}</span> | Reps: <span class="font-bold text-white">{{ exercicio.reps }}</span></p>
        </div>
        <div *ngIf="exercicio.concluido" class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        
        <div class="bg-neutral-900 p-3 rounded-lg border border-neutral-700/50 flex flex-col justify-center">
          
          <ng-container *ngIf="exercicio.cargaAnterior; else primeiraSemana">
            <span class="text-xs text-neutral-400 font-medium uppercase tracking-wider mb-1">Meta (Último Treino)</span>
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-black text-white">{{ exercicio.cargaAnterior }}</span>
              <span class="text-sm text-orange-500 font-bold">kg</span>
            </div>
          </ng-container>

          <ng-template #primeiraSemana>
            <span class="text-xs text-neutral-400 font-medium uppercase tracking-wider mb-1">Sugerido (Professor)</span>
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-black text-white">{{ exercicio.cargaSugerida }}</span>
              <span class="text-sm text-neutral-500 font-bold">kg</span>
            </div>
          </ng-template>

        </div>

        <div>
          <label class="block text-xs text-orange-500 font-bold uppercase tracking-wider mb-1">Carga de Hoje</label>
          <div class="relative">
            <input type="number" 
                   [(ngModel)]="exercicio.cargaRealizada" 
                   [disabled]="exercicio.concluido"
                   placeholder="0"
                   class="w-full px-4 py-3 bg-neutral-900 border border-orange-500/30 rounded-lg text-white font-bold text-xl placeholder-neutral-700 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors disabled:opacity-50 text-center">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 font-bold">kg</span>
          </div>
        </div>
      </div>

      <button (click)="marcarConcluido(exercicio)"
              [ngClass]="exercicio.concluido ? 'bg-neutral-700 text-neutral-300 hover:bg-neutral-600' : 'bg-orange-600 hover:bg-orange-500 text-white shadow-lg shadow-orange-900/50'"
              class="w-full py-3 rounded-lg font-black uppercase tracking-wide transition-all duration-200">
        {{ exercicio.concluido ? 'Desfazer' : 'Marcar como Feito' }}
      </button>

    </div>
  </main>
</div>
