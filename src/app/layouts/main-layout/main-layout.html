<div class="relative h-screen flex bg-neutral-900 text-white font-sans overflow-hidden">

    <div *ngIf="menuAberto" (click)="toggleMenu()" class="fixed inset-0 bg-black/60 z-40 md:hidden transition-opacity">
    </div>

    <aside
        class="fixed inset-y-0 left-0 z-50 w-64 bg-neutral-800 border-r border-neutral-700 transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
        [class.-translate-x-full]="!menuAberto">

        <div class="flex items-center justify-between p-4 border-b border-neutral-700">
            <h2 class="text-2xl font-black text-orange-500 italic uppercase tracking-tighter">Força Bruta</h2>
            <button (click)="toggleMenu()" class="md:hidden text-neutral-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <nav class="p-4 space-y-2">
            <a routerLink="/dashboard" (click)="toggleMenu()"
                class="flex items-center gap-3 px-4 py-3 hover:bg-neutral-700 text-neutral-400 hover:text-white rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                Dashboard (Aluno)
            </a>
            <a routerLink="/treino" (click)="toggleMenu()"
                class="flex items-center gap-3 px-4 py-3 text-neutral-400 hover:bg-neutral-700 hover:text-white rounded-lg font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                    </path>
                </svg>
                Treino do Dia
            </a>
            <a routerLink="/instrutor" (click)="toggleMenu()"
                class="flex items-center gap-3 px-4 py-3 mt-8 border border-orange-500/30 text-orange-500 hover:bg-orange-500/10 rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path>
                </svg>
                Visão do Coach
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">

        <header
            class="flex items-center justify-between p-4 border-b border-neutral-700 bg-neutral-800 md:justify-end md:px-8 shadow-sm z-10">
            <button (click)="toggleMenu()" class="md:hidden text-neutral-400 hover:text-white">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-bold text-white">Carlos Atleta</p>
                    <a routerLink="/login" class="text-xs text-red-500 hover:underline">Sair</a>
                </div>
                <div
                    class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center font-bold text-white shadow-lg">
                    CA</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto bg-neutral-900">
            <router-outlet></router-outlet>
        </div>

    </main>
</div>
