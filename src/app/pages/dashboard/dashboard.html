<div class="p-4 md:p-8 space-y-6 w-full">

  <div>
    <h3 class="text-2xl font-bold">Evolução de Cargas (Realizado)</h3>
    <p class="text-neutral-400 text-sm mt-1">Acompanhamento das tuas últimas 4 semanas de SBD.</p>
  </div>

  <div class="bg-neutral-800 p-5 rounded-xl border border-neutral-700 w-full overflow-hidden shadow-lg">
    <h4 class="font-bold text-lg mb-2 text-orange-500">Evolução no Agachamento</h4>
    <div class="-ml-4 -mr-2">
      <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
        [stroke]="chartOptions.stroke" [dataLabels]="chartOptions.dataLabels" [fill]="chartOptions.fill"
        [colors]="chartOptions.colors" [tooltip]="chartOptions.tooltip">
      </apx-chart>
    </div>
  </div>

  <div class="bg-neutral-800 rounded-xl border border-neutral-700 shadow-lg overflow-hidden mt-6">

    <div
      class="p-4 border-b border-neutral-700 bg-neutral-800/50 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
      <div>
        <h4 class="font-bold text-lg text-white">Comparativo Semanal</h4>
        <p class="text-xs text-neutral-400">Tuas cargas realizadas nas semanas passadas</p>
      </div>

      <div class="relative">
        <select [(ngModel)]="semanaSelecionada"
          class="w-full sm:w-48 px-4 py-2 bg-neutral-900 border border-neutral-700 rounded-lg text-white text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 cursor-pointer appearance-none">
          <option *ngFor="let semana of semanasHistorico" [ngValue]="semana">
            {{ semana.titulo }}
          </option>
        </select>
        <svg class="w-4 h-4 text-orange-500 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <div class="p-4 space-y-3 bg-neutral-900/30">

      <div *ngFor="let ex of semanaSelecionada.exercicios"
        class="flex flex-col sm:flex-row sm:items-center justify-between bg-neutral-900 p-4 rounded-lg border border-neutral-700/50 hover:border-orange-500/30 transition-colors">

        <div class="mb-2 sm:mb-0">
          <p class="font-bold text-white">{{ ex.nome }}</p>
          <p class="text-xs text-neutral-400 mt-1">Séries: <span class="text-white font-bold">{{ ex.series }}</span> |
            Reps: <span class="text-white font-bold">{{ ex.reps }}</span></p>
        </div>

        <div
          class="text-left sm:text-right bg-neutral-800 sm:bg-transparent p-3 sm:p-0 rounded border border-neutral-700 sm:border-none mt-2 sm:mt-0">
          <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold mb-1">Carga Realizada</p>
          <div class="flex items-baseline sm:justify-end gap-1">
            <p class="font-black text-2xl text-orange-500">{{ ex.carga }}</p>
            <p class="text-sm font-bold text-orange-600">kg</p>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>
