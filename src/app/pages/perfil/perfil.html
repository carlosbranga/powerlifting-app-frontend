<div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6 w-full">
    
    <div class="bg-neutral-800 p-6 rounded-2xl border border-neutral-700 shadow-xl">
        <div class="mb-6">
            <h2 class="text-3xl font-black text-orange-500 italic uppercase tracking-tighter">Meu Perfil</h2>
            <p class="text-neutral-400 text-sm mt-1">Gerencie suas informações de atleta</p>
        </div>

        @if (mensagemSucesso) {
            <div class="bg-green-500/10 border border-green-500 text-green-400 text-sm font-bold p-3 rounded-lg text-center mb-4">
                {{ mensagemSucesso }}
            </div>
        }

        @if (mensagemErro) {
            <div class="bg-red-500/10 border border-red-500 text-red-500 text-sm font-bold p-3 rounded-lg text-center mb-4">
                {{ mensagemErro }}
            </div>
        }

        <form class="space-y-5" (ngSubmit)="salvarPerfil()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="nome" class="block text-sm font-medium mb-1 text-neutral-300">Nome Completo</label>
                    <input [(ngModel)]="user.nome" name="nome" type="text" id="nome"
                        class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium mb-1 text-neutral-400">E-mail (Não alterável)</label>
                    <input [(ngModel)]="user.email" name="email" type="email" id="email" disabled
                        class="w-full px-4 py-3 bg-neutral-900/50 border border-neutral-800 rounded-lg text-neutral-500 cursor-not-allowed outline-none">
                </div>

                <div>
                    <label for="weight-class" class="block text-sm font-medium mb-1 text-neutral-300">Categoria de Peso</label>
                    <select id="weight-class" name="peso_corporal" [(ngModel)]="user.peso_corporal"
                        class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors appearance-none">
                        <option value="59">Até 59 kg</option>
                        <option value="66">Até 66 kg</option>
                        <option value="74">Até 74 kg</option>
                        <option value="83">Até 83 kg</option>
                        <option value="93">Até 93 kg</option>
                        <option value="105">Até 105 kg</option>
                        <option value="120">Até 120 kg</option>
                        <option value="120.01">+ 120 kg (Pesadão)</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end mt-6">
                <button type="submit"
                    class="py-3 px-6 bg-orange-600 hover:bg-orange-500 text-white font-black text-md rounded-lg uppercase tracking-wide transition-colors duration-200 shadow-lg shadow-orange-900/50">
                    Salvar Alterações
                </button>
            </div>
        </form>
    </div>
</div>
