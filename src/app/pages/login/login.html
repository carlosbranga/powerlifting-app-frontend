<div class="min-h-screen bg-neutral-900 flex items-center justify-center p-4 font-sans">

    <div class="bg-neutral-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-neutral-700">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-orange-500 italic tracking-tighter uppercase">
                Powerlifting
            </h1>
            <p class="text-neutral-400 mt-2 font-medium">Software pra controlar seus treinos</p>
        </div>

        <div class="w-full flex justify-center bg-white rounded-lg shadow-md hover:bg-gray-100 transition-colors">
            <asl-google-signin-button type="standard" size="large" [width]="350" theme="outline"
                class="w-full flex justify-center py-1">
            </asl-google-signin-button>
        </div>

        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-neutral-600"></div>
            <span class="px-3 text-neutral-400 text-sm font-semibold">OU</span>
            <div class="flex-grow border-t border-neutral-600"></div>
        </div>

        <form class="space-y-5">

            <div>
                <label for="email" class="block text-sm font-medium mb-1 text-neutral-300">E-mail</label>
                <input type="email" id="email" placeholder="atleta@powerlifting.com"
                    class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-sm font-medium text-neutral-300">Senha</label>
                    <a routerLink="/esqueci-senha"
                        class="text-xs text-orange-500 hover:text-orange-400 hover:underline transition-colors cursor-pointer">
                        Esqueceu a senha?
                    </a>
                </div>
                <input type="password" id="password" placeholder="Sua senha de acesso"
                    class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
            </div>

            <button routerLink="/dashboard" type="button"
                class="w-full mt-4 py-3 px-4 bg-orange-600 hover:bg-orange-500 text-white font-black text-lg rounded-lg uppercase tracking-wide transition-colors duration-200 shadow-lg shadow-orange-900/50">
                Entrar
            </button>

        </form>

        <div class="text-center mt-8">
            <p class="text-sm text-neutral-400">
                Primeira vez na plataforma?
                <a routerLink="/cadastro"
                    class="text-orange-500 font-bold hover:text-orange-400 hover:underline transition-colors cursor-pointer">
                    Crie uma conta
                </a>
            </p>
        </div>

    </div>
</div>
